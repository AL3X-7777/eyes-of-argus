name = "eyes-of-argus"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Recount changed channels and update the snapshot every 15 minutes
[triggers]
crons = ["*/15 * * * *"]

[vars]
POW_BITS = "18"          # one-time puzzle when an install registers (~2–10 s in a browser)
MIN_VOTES = "5"          # weighted votes needed before a mark shows for everyone
MIN_AGREE = "70"         # % agreement needed
VOTES_PER_DAY = "500"    # per install
VOTES_PER_IP_DAY = "3000"
REG_PER_IP_DAY = "5"     # new installs per network per day

[[d1_databases]]
binding = "DB"
database_name = "argus"
database_id = "00000000-0000-0000-0000-000000000000"   # replace with the id from `npx wrangler d1 create argus`

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "eyes-of-argus"

# Secrets (not in this file):  npx wrangler secret put SALT   and   npx wrangler secret put ADMIN_TOKEN
